name: Export Gate

on:
  push:
    paths:
      - 'ReaUI_Builder.html'
      - 'tools/export-gate/**'
      - '.github/workflows/export-gate.yml'
  pull_request:
    paths:
      - 'ReaUI_Builder.html'
      - 'tools/export-gate/**'
      - '.github/workflows/export-gate.yml'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jsdom
        working-directory: tools/export-gate
        run: npm install --no-save jsdom@26.1.0

      - name: Run full export gate on current build
        run: node tools/export-gate/export_gate.js ReaUI_Builder.html

      - name: Compare PR against base build
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git show origin/${{ github.base_ref }}:ReaUI_Builder.html > base_ReaUI_Builder.html
          set +e
          node tools/export-gate/export_gate.js base_ReaUI_Builder.html ReaUI_Builder.html > export_gate_diff.log 2>&1
          STATUS=$?
          set -e
          cat export_gate_diff.log
          if [ "$STATUS" -ge 2 ]; then
            echo "::error::Export gate encountered a failure (exit $STATUS)"
            exit "$STATUS"
          fi
          if [ "$STATUS" -eq 1 ]; then
            echo "::warning::Export/model outputs changed relative to base. Review the diff above."
          fi
