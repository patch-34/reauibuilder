name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example, 2.2.3); matching HTML and release notes must exist'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-2.2.3}"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a version in major.minor.patch format."
            exit 1
          fi
          stem="${tag//./_}"
          test -s "ReaUI_Builder_${stem}.html"
          test -s "RELEASE_NOTES_${stem}.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "html=ReaUI_Builder_${stem}.html" >> "$GITHUB_OUTPUT"
          echo "notes=RELEASE_NOTES_${stem}.md" >> "$GITHUB_OUTPUT"

      - name: Publish if not already released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          HTML: ${{ steps.release.outputs.html }}
          NOTES: ${{ steps.release.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" "$HTML" \
            --title "ReaUI Builder $TAG" \
            --notes-file "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest
